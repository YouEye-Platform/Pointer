name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pointer
          POSTGRES_PASSWORD: pointer
          POSTGRES_DB: pointer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pointer -d pointer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pointer:pointer@127.0.0.1:5432/pointer_test
      CATALOG_POSTGRES_TEST_DATABASE: pointer_test
      MANAGED_POSTGRES_TEST_DATABASE: pointer_test
      JWT_SECRET: ci-only-not-a-production-secret
      ENCRYPTION_SECRET: ci-only-not-a-production-secret
      CORS_ORIGIN: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:postgres
      - run: pnpm test:e2e
