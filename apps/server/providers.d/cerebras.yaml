id: cerebras
name: Cerebras
type: openai-compatible
baseUrl: https://api.cerebras.ai/v1
auth:
  type: bearer
  keyPrefix: "csk-"

endpoints:
  chatCompletions: /chat/completions
  models: /models

gateway:
  operations:
    generate:
      format: chat-completions
      endpoint: /chat/completions

models:
  discovery:
    enabled: true
    listPath: data
    idField: id
    nameField: id
