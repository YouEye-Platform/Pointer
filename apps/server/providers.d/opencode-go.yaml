id: opencode-go
name: OpenCode Go
type: openai-compatible
baseUrl: https://opencode.ai/zen/go/v1
auth:
  type: bearer
endpoints:
  chatCompletions: /chat/completions
  responses: /responses
  messages: /messages
  models: /models
gateway:
  operations:
    generate:
      format: chat-completions
      endpoint: /chat/completions
models:
  discovery:
    enabled: true
    listPath: data
    idField: id
headers:
  User-Agent: Pointer/0.5.0.0.3
handler: opencode-go
