id: google-gemini
name: Google Gemini
type: custom
baseUrl: https://generativelanguage.googleapis.com
auth:
  type: header
  header: x-goog-api-key

endpoints:
  models: /v1beta/models

gateway:
  operations:
    generate:
      format: google-generate-content
      endpoint: /v1beta/models/{model}:generateContent
    streamGenerate:
      format: google-generate-content
      endpoint: /v1beta/models/{model}:streamGenerateContent?alt=sse
    countTokens:
      format: google-generate-content
      endpoint: /v1beta/models/{model}:countTokens
    embedContent:
      format: google-generate-content
      endpoint: /v1beta/models/{model}:embedContent
    batchEmbedContents:
      format: google-generate-content
      endpoint: /v1beta/models/{model}:batchEmbedContents

models:
  discovery:
    enabled: true
    listPath: models
    idField: name
    nameField: displayName
    contextField: inputTokenLimit
    pagination:
      cursorParam: pageToken
      cursorPath: nextPageToken
      pageSizeParam: pageSize
      pageSize: 1000
      maxPages: 100

handler: google-gemini
